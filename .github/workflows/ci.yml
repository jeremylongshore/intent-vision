# IntentVision CI/CD Pipeline
# Phase F: Cloud Deployment Infrastructure
# Beads Tasks: intentvision-xyq (Phase F Epic)
#
# Triggers on push to main and pull requests
# Runs tests and builds. The Cloud Run deploy/smoke jobs were removed on
# 2026-09-25: the GCP estate is retired, so they could only fail.
#
# Jobs:
# - test: Unit/integration tests (no external deps)
# - build: Docker image build
#

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Test Job - Run all tests
  # =============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run pipeline tests
        run: npm run test:pipeline

      - name: Run operator tests
        run: npm run test:operator

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          fail_ci_if_error: false

  # =============================================================================
  # Build Job - Build Docker image
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Build Docker image
        run: docker build -t intentvision:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d --name test-container \
            -p 8080:8080 \
            -e INTENTVISION_DB_URL=file::memory: \
            intentvision:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop test-container

  # =============================================================================
  # Notify Job - Send notifications
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "Tests failed!"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "Build failed!"
          fi
